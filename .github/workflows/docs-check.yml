name: Documentation contract
on:
  push:
    branches: [main]
    paths: ['README.md', 'docs/**', 'tests/docs.test.cjs', '.github/workflows/**']
  pull_request:
    paths: ['README.md', 'docs/**', 'tests/docs.test.cjs', '.github/workflows/**']
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/docs.test.cjs
