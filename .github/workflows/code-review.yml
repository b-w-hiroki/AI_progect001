name: Code Review

# PRのコードレビューをClaudeに実行させる。
#
# 既定では「PR作成時」と「ドラフト解除時」にのみ動かす。
# types に synchronize を足すと毎プッシュで走るが、そのぶんトークン費用が増える。
# ソロ開発では往々にしてプッシュ回数が多いので、まずはこの設定から始める。
on:
  pull_request:
    types: [opened, ready_for_review]

  # 手動で再レビューしたいとき用。PR番号の指定が必須
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "レビュー対象のPR番号"
        required: true
        type: string

# 同じPRで連続実行されたら古いほうを止める（無駄な課金を避ける）
concurrency:
  group: code-review-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  # 必須。claude-code-action はGitHubトークンの取得にOIDCを使うため、
  # これが無いと "Could not fetch an OIDC token" で即座に失敗する。
  # AWS連携用の権限だと誤解しやすいが、APIキー方式でも必要。
  id-token: write

jobs:
  review:
    # ドラフトPRは自動レビューしない。手動実行なら常に走らせる
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # セットアップ不備の検出。シークレットが無いまま本体を走らせると
      # 「Environment variable validation failed」という分かりにくい失敗になるため、
      # 先に明確なメッセージで止め、PRへ1回だけ手順コメントを投稿する。
      - name: 認証シークレットの事前チェック
        env:
          TOKEN_SET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          if [ "$TOKEN_SET" = "true" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN: 登録済み"
            exit 0
          fi

          echo "::error::CLAUDE_CODE_OAUTH_TOKEN が Repository secrets に未登録です。docs/pr-code-review.md の Step 2〜3 を実施してください。"
          echo "## ⚠️ レビュー未実行: 認証シークレット未登録" >> "$GITHUB_STEP_SUMMARY"
          echo "docs/pr-code-review.md の Step 2〜3 を実施してください。" >> "$GITHUB_STEP_SUMMARY"

          marker="<!-- claude-setup-guard -->"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q '.[].body' | grep -qF "$marker"; then
            echo "案内コメントは投稿済みのためスキップ"
          else
            printf '%s\n' \
              '<!-- claude-setup-guard -->' \
              '⚠️ **AIレビューは実行されませんでした** — 認証シークレットが未登録です（このPRの内容が原因ではありません）。' \
              '' \
              '1. PCで `claude setup-token` を実行し、表示されたトークンをコピー' \
              "2. [Settings → Secrets and variables → Actions](https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions) の **Secrets タブ**で \`CLAUDE_CODE_OAUTH_TOKEN\` として登録" \
              '3. **Repository secrets の一覧に名前が出ることを確認**（Variables タブや Environment secrets では読めません）' \
              '' \
              '登録後、Checks タブから `Code Review` を Re-run してください。詳細: `docs/pr-code-review.md`' \
              '' \
              '---' \
              '_Generated by [Claude Code](https://claude.ai/code)_' \
              > /tmp/setup-guard-comment.md
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@/tmp/setup-guard-comment.md
          fi
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 差分の前後関係を見られるように全履歴を取る

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          # 認証はサブスクリプション方式。ローカルで `claude setup-token` を実行して
          # 得たトークンを、リポジトリシークレット CLAUDE_CODE_OAUTH_TOKEN に登録する。
          # APIキー（anthropic_api_key）でも動くが、その場合は従量課金になる。
          # トークンには有効期限があるので、認証エラーで落ちたら再発行する。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # pull_request イベントなら event から、手動実行なら入力から番号を取る。
          # どちらか片方しか値が入らないので || で拾える。
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pull_request_number }}"
          claude_args: |
            --max-turns 20
