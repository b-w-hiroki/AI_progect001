name: Claude

# PRやIssueのコメントで @claude と書くと応答する。
#
# 用途はレビューの後工程:
#   - 「@claude この指摘を直して」→ 修正をコミットさせる
#   - 「@claude なぜこの実装にした?」→ 意図を説明させる
#
# code-review.yml が「指摘する」担当、こちらが「対話・修正する」担当。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false # 修正作業を途中で止めない

permissions:
  contents: write # 修正をコミットさせるため
  pull-requests: write
  issues: write
  # 必須。claude-code-action はGitHubトークンの取得にOIDCを使うため、
  # これが無いと "Could not fetch an OIDC token" で即座に失敗する。
  id-token: write

jobs:
  claude:
    # @claude を含むコメントのときだけ起動する。
    # この条件が無いと全コメントでジョブが立ち上がり課金される。
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # セットアップ不備の検出。@claude と呼びかけたのに無反応、を防ぐため、
      # シークレットが無ければ明確なメッセージで止め、呼びかけ元へ1回だけ案内を返す。
      - name: 認証シークレットの事前チェック
        env:
          TOKEN_SET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ "$TOKEN_SET" = "true" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN: 登録済み"
            exit 0
          fi

          echo "::error::CLAUDE_CODE_OAUTH_TOKEN が Repository secrets に未登録です。README.md の「GitHubに置いたあと」の手順を実施してください。"

          marker="<!-- claude-setup-guard -->"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$NUM/comments" --paginate -q '.[].body' | grep -qF "$marker"; then
            echo "案内コメントは投稿済みのためスキップ"
          else
            printf '%s\n' \
              '<!-- claude-setup-guard -->' \
              '⚠️ **@claude は応答できませんでした** — 認証シークレットが未登録です。' \
              '' \
              '1. PCで `claude setup-token` を実行し、表示されたトークンをコピー' \
              "2. [Settings → Secrets and variables → Actions](https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions) の **Secrets タブ**で \`CLAUDE_CODE_OAUTH_TOKEN\` として登録" \
              '3. **Repository secrets の一覧に名前が出ることを確認**（Variables タブや Environment secrets では読めません）' \
              '' \
              '登録後、もう一度 @claude 宛にコメントしてください。詳細: `README.md` の「GitHubに置いたあと」' \
              '' \
              '---' \
              '_Generated by [Claude Code](https://claude.ai/code)_' \
              > /tmp/setup-guard-comment.md
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUM/comments" -F body=@/tmp/setup-guard-comment.md
          fi
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          # code-review.yml と同じシークレットを使う。発行方法はそちらのコメントを参照
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 20
